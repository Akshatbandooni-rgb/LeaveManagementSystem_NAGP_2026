networks:
  leave-net:
    driver: bridge

volumes:
  rabbitmq_data:
    driver: local

services:
  consul:
    image: hashicorp/consul:latest
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
    networks:
      - leave-net
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - leave-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  jaeger:
    image: jaegertracing/all-in-one:1.52
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - leave-net

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    networks:
      - leave-net
    env_file:
      - .env
    environment:
      PORT: 3001
      SERVICE_NAME: user-service
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      CONSUL_URL: http://consul:8500
      CONSUL_SERVICE_HOST: user-service
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  leave-service:
    build:
      context: .
      dockerfile: services/leave-service/Dockerfile
    networks:
      - leave-net
    env_file:
      - .env
    environment:
      PORT: 3002
      SERVICE_NAME: leave-service
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      CONSUL_URL: http://consul:8500
      CONSUL_SERVICE_HOST: leave-service
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    networks:
      - leave-net
    env_file:
      - .env
    environment:
      PORT: 3003
      SERVICE_NAME: notification-service
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      CONSUL_URL: http://consul:8500
      CONSUL_SERVICE_HOST: notification-service
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    networks:
      - leave-net
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      SERVICE_NAME: api-gateway
      CONSUL_URL: http://consul:8500
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
      leave-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
